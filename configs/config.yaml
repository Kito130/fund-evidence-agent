nav:
  official_asset_url_template: https://fund.chinaamc.com/fund/{code}/zoust_all.js
  official_history_url: https://fund.chinaamc.com/product/fundLishijingzhi.do
  window_rule: latest_24_calendar_months_common_dates
  minimum_common_dates: 400
  fields:
    - date
    - unit_nav
    - cumulative_nav

metrics:
  nav_field: cumulative_nav
  return_type: simple_observation_to_observation
  calendar_fill: false
  annualization_factor: 252
  volatility_ddof: 1
  max_drawdown_sign: non_positive
  public_top10:
    comparison_period_rule: same_report_period_only
    terminology: 公开前十大持仓重合

pdf_parsing:
  library: PyMuPDF
  parser_version: f4_pymupdf_v1
  page_number_basis: one_based_physical_pdf_page
  remove_repeated_headers_and_footers: true
  chunk_scope: single_physical_page_single_document
  recommended_minimum_chunk_chars: 400
  maximum_chunk_chars: 800
  overlap_chars: 60
  maximum_allowed_overlap_chars: 80

retrieval:
  model_version: f5_char_ngram_tfidf_v1
  analyzer: normalized_chinese_alphanumeric_character_ngram
  ngram_min: 2
  ngram_max: 4
  term_frequency: one_plus_natural_log_count
  inverse_document_frequency: smoothed
  similarity: cosine
  default_top_k: 3
  maximum_top_k: 10
  require_fund_code_filter: true
  require_period_filter: true
  external_api_calls: 0

memo:
  system_name: 可追溯文档检索与模板化投研 Memo 系统
  maximum_cited_cards: 3
  minimum_top_cosine_score: 0.05
  minimum_query_ngram_coverage: 0.50
  facts_are_exact_source_excerpts: true
  headings:
    - 已确认事实
    - 原文证据
    - 研究含义
    - 当前无法确认的内容
  refusal_message: 当前文档不足以回答该问题。
  external_model_calls: 0

evaluation:
  schema_version: f7_dev_holdout_evaluation_v1
  retrieval_top_k: 5
  memo_maximum_cited_cards: 3
  question_counts:
    development: 10
    holdout: 5
  question_types:
    - single_document_fact
    - cross_quarter_change
    - cross_fund_comparison
    - unanswerable
  metrics:
    - gold_page_recall_at_5
    - mrr_at_5
    - citation_support_rate
    - answer_completeness
    - unsupported_claim_rate
    - refusal_accuracy
    - end_to_end_pass_count
  holdout:
    execution_policy: exactly_once_after_freeze
    run_count: 1
    rerun_forbidden: true
    tuning_after_results_forbidden: true
    frozen_quality_targets:
      minimum_holdout_gold_page_recall_at_5: 0.80
      minimum_holdout_mrr_at_5: 0.80
      required_citation_support_rate: 1.0
      minimum_answer_completeness: 0.80
      required_unsupported_claim_rate: 0.0
      required_refusal_accuracy: 1.0
      minimum_holdout_end_to_end_pass_count: 4

streamlit:
  local_only: true
  deployment_enabled: false
  app: app.py
  page_count: 2
  pages:
    - 基金与组合诊断
    - 研究证据与 Memo
  external_api_calls: 0
  writes_user_questions_to_disk: false
  holdout_rerun_performed: false

public_demo:
  default_profile: demo_synthetic
  profiles:
    - demo_synthetic
    - sample_real
  network_required: false
  api_key_required: false
  complete_pdf_in_repository: false
  real_excerpt_maximum_chars: 110

reporting:
  build_script: scripts/build_f10_materials.py
  default_pdf_engine: reportlab
  latex_source_preserved: true
  expected_pdf_pages: 12
  expected_figure_count: 6
  expected_table_count: 8
  full_page_visual_qa_required: true
  deployment_enabled: false
